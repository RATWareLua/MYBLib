# Continuous integration of myb: the CMake presets of the repository on Linux (Clang, Ninja) and
# Windows (Clang targeting x86_64-w64-windows-gnu with the MSYS2 MINGW64 sysroot), with the
# sanitizers. Every job runs the whole test suite, the reproducibility hash included, so a
# result that changes by one bit on one platform fails the build. Large data sets are fetched
# by cmake/FetchData.cmake (SHA-256 checked) and cached between runs; the live series (EOP,
# Earth orientation kernel) are refreshed on every run.
#
# Runs on pushed tags (releases) and on request only — not on every push.
name: CI

on:
  push:
    tags: ["*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LLVM_VERSION: "20"
  CTEST_TIMEOUT: "3600"

jobs:
  linux:
    name: linux (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-dev, linux-release, linux-asan, linux-asan-debug, linux-ubsan, linux-lsan,
                 linux-tsan]
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang ${{ env.LLVM_VERSION }}, Ninja, MPFR
        shell: bash
        run: |
          set -euo pipefail
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm.sh "$LLVM_VERSION"
          sudo apt-get install -y --no-install-recommends \
            "clang-$LLVM_VERSION" "lld-$LLVM_VERSION" "llvm-$LLVM_VERSION" \
            ninja-build cmake libmpfr-dev libgmp-dev
          echo "/usr/lib/llvm-$LLVM_VERSION/bin" >> "$GITHUB_PATH"

      - name: Allow the sanitizers' shadow memory (kernel ASLR entropy)
        shell: bash
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Cache the downloaded data
        uses: actions/cache@v4
        with:
          path: data/download
          key: data-${{ hashFiles('cmake/FetchData.cmake') }}-${{ github.run_id }}
          restore-keys: data-${{ hashFiles('cmake/FetchData.cmake') }}-

      - name: Fetch the data (fresh live series)
        shell: bash
        run: cmake -DREFRESH=ON -P cmake/FetchData.cmake

      - name: Configure
        shell: bash
        run: |
          clang --version
          cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 4

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --parallel 4 --timeout ${{ env.CTEST_TIMEOUT }}

  windows:
    name: windows (${{ matrix.preset }})
    runs-on: windows-2025
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-dev, windows-release, windows-ubsan]
    steps:
      - uses: actions/checkout@v4

      - name: MSYS2 MINGW64 sysroot (headers, runtime, mingw32-make, MPFR, GMP)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-mpfr
            mingw-w64-x86_64-gmp

      - name: Clang ${{ env.LLVM_VERSION }} (LLVM for Windows)
        shell: pwsh
        run: |
          $have = $null
          if (Get-Command clang -ErrorAction SilentlyContinue) {
            $have = [int]((clang --version | Select-Object -First 1) -replace '.*version (\d+).*', '$1')
          }
          if ($null -eq $have -or $have -lt 19) {
            choco install llvm --version=20.1.8 --allow-downgrade -y --no-progress
          }
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "MYB_MINGW_ROOT=${{ steps.msys2.outputs.msys2-location }}\mingw64" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Cache the downloaded data
        uses: actions/cache@v4
        with:
          path: data/download
          key: data-${{ hashFiles('cmake/FetchData.cmake') }}-${{ github.run_id }}
          restore-keys: data-${{ hashFiles('cmake/FetchData.cmake') }}-

      - name: Fetch the data (fresh live series)
        shell: pwsh
        run: cmake -DREFRESH=ON -P cmake/FetchData.cmake

      - name: Configure
        shell: pwsh
        run: |
          clang --version
          cmake --preset ${{ matrix.preset }}

      - name: Build
        shell: pwsh
        run: cmake --build --preset ${{ matrix.preset }} --parallel 4

      - name: Test
        shell: pwsh
        run: ctest --preset ${{ matrix.preset }} --parallel 4 --timeout ${{ env.CTEST_TIMEOUT }}
