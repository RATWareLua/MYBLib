# Continuous integration of myb: the CMake presets of the repository on Linux (Clang, Ninja; x86-64
# and ARM64), macOS (the Clang of Homebrew's LLVM on Apple silicon) and Windows (Clang targeting
# x86_64-w64-windows-gnu with the MSYS2 MINGW64 sysroot), with the sanitizers. Every job runs the
# whole test suite, the reproducibility hash included, so a result that changes by one bit on one
# platform or processor fails the build. On Windows, programs built by Microsoft's compiler and
# by the MSVC toolchain of Rust are checked against the shared library as well
# (test_msvc_consumer, test_rust_binding_msvc). The tests of bindings/ run in
# the presets without a sanitizer: C++ everywhere, Rust wherever cargo is, Python where the
# shared library is built — the "Bindings" step installs what they need and then checks that
# CMake registered them, so that a missing interpreter or toolchain fails the job instead of
# skipping the tests. Large data sets are fetched
# by cmake/FetchData.cmake (SHA-256 checked) and cached between runs; the live series (EOP,
# Earth orientation kernel) are refreshed on every run.
#
# Runs on pushed tags (releases) and on request only — not on every push.
name: CI

on:
  push:
    tags: ["*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LLVM_VERSION: "20"
  CTEST_TIMEOUT: "3600"

jobs:
  linux:
    name: linux ${{ matrix.arch }} (${{ matrix.preset }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-dev, linux-release, linux-asan, linux-asan-debug, linux-ubsan, linux-lsan,
                 linux-tsan]
        arch: [x86-64]
        runner: [ubuntu-24.04]
        include:
          # ARM64: the same bits from another processor (no FMA contraction, the library's own
          # correctly rounded functions)
          - { preset: linux-release, arch: arm64, runner: ubuntu-24.04-arm }
          - { preset: linux-asan, arch: arm64, runner: ubuntu-24.04-arm }
          - { preset: linux-ubsan, arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang ${{ env.LLVM_VERSION }}, Ninja, MPFR
        shell: bash
        run: |
          set -euo pipefail
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm.sh "$LLVM_VERSION"
          sudo apt-get install -y --no-install-recommends \
            "clang-$LLVM_VERSION" "lld-$LLVM_VERSION" "llvm-$LLVM_VERSION" \
            "libclang-rt-$LLVM_VERSION-dev" ninja-build cmake pkgconf libmpfr-dev libgmp-dev
          echo "/usr/lib/llvm-$LLVM_VERSION/bin" >> "$GITHUB_PATH"

      - name: Go (the test of bindings/go)
        if: ${{ matrix.preset == 'linux-dev' || matrix.preset == 'linux-release' }}
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false

      - name: GHC and cabal (the test of bindings/haskell)
        if: ${{ matrix.preset == 'linux-release' }}
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.10.3"
          cabal-version: "latest"

      - name: Python with cffi and Rust (the tests of bindings/)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends python3-cffi
          python3 -c "import cffi; print('cffi', cffi.__version__)"
          if ! command -v cargo > /dev/null; then
            # an image without Rust (the ARM64 one may be): rustup, the minimal profile
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          cargo --version

      - name: Allow the sanitizers' shadow memory (kernel ASLR entropy)
        shell: bash
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Cache the downloaded data
        uses: actions/cache@v4
        with:
          path: data/download
          key: data-${{ hashFiles('cmake/FetchData.cmake') }}-${{ github.run_id }}
          restore-keys: data-${{ hashFiles('cmake/FetchData.cmake') }}-

      - name: Fetch the data (fresh live series)
        shell: bash
        run: cmake -DREFRESH=ON -P cmake/FetchData.cmake

      - name: Configure
        shell: bash
        run: |
          clang --version
          cmake --preset ${{ matrix.preset }}

      - name: Bindings are registered
        if: ${{ matrix.preset == 'linux-dev' || matrix.preset == 'linux-release' || matrix.preset == 'linux-asan' }}
        shell: bash
        run: |
          set -euo pipefail
          ctest --preset ${{ matrix.preset }} -N > registered.txt
          grep -q test_cpp_binding registered.txt
          if [ "${{ matrix.preset }}" = linux-asan ]; then
            # Python and Rust over the instrumented library
            grep -q test_python_binding_asan registered.txt
            grep -q test_rust_binding_asan registered.txt
          else
            grep -q test_rust_binding registered.txt
            grep -q test_go_binding registered.txt
            if grep -q 'MYB_BUILD_SHARED:BOOL=ON' build/${{ matrix.preset }}/CMakeCache.txt; then
              grep -q test_python_binding registered.txt
              grep -q test_gcc_consumer registered.txt
            fi
            if [ "${{ matrix.preset }}" = linux-release ]; then
              grep -q test_haskell_binding registered.txt
            fi
          fi

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 4

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --parallel 4 --timeout ${{ env.CTEST_TIMEOUT }}

  fuzz:
    name: linux fuzz (libFuzzer, 60 s a harness)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang ${{ env.LLVM_VERSION }} with libFuzzer, Ninja
        shell: bash
        run: |
          set -euo pipefail
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm.sh "$LLVM_VERSION"
          sudo apt-get install -y --no-install-recommends \
            "clang-$LLVM_VERSION" "lld-$LLVM_VERSION" "llvm-$LLVM_VERSION" \
            "libclang-rt-$LLVM_VERSION-dev" ninja-build cmake libmpfr-dev libgmp-dev
          echo "/usr/lib/llvm-$LLVM_VERSION/bin" >> "$GITHUB_PATH"
          sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Cache the downloaded data
        uses: actions/cache@v4
        with:
          path: data/download
          key: data-${{ hashFiles('cmake/FetchData.cmake') }}-${{ github.run_id }}
          restore-keys: data-${{ hashFiles('cmake/FetchData.cmake') }}-

      - name: Fetch the data
        run: cmake -P cmake/FetchData.cmake

      - name: Configure and build the harnesses
        run: |
          cmake --preset linux-fuzz
          cmake --build --preset linux-fuzz --parallel 4

      - name: Replay the corpora
        run: ctest --preset linux-fuzz -L fuzz --parallel 4

      - name: Fuzz (60 s a harness)
        run: cmake -DBUILD_DIR=build/linux-fuzz -DSECONDS=60 -P tests/fuzz/run_fuzzers.cmake

      - name: Keep the crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: build/linux-fuzz/fuzz/crashes

  coverage:
    name: linux coverage (llvm-cov)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang ${{ env.LLVM_VERSION }}, Ninja, MPFR
        shell: bash
        run: |
          set -euo pipefail
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm.sh "$LLVM_VERSION"
          sudo apt-get install -y --no-install-recommends \
            "clang-$LLVM_VERSION" "lld-$LLVM_VERSION" "llvm-$LLVM_VERSION" \
            "libclang-rt-$LLVM_VERSION-dev" ninja-build cmake libmpfr-dev libgmp-dev
          echo "/usr/lib/llvm-$LLVM_VERSION/bin" >> "$GITHUB_PATH"

      - name: Cache the downloaded data
        uses: actions/cache@v4
        with:
          path: data/download
          key: data-${{ hashFiles('cmake/FetchData.cmake') }}-${{ github.run_id }}
          restore-keys: data-${{ hashFiles('cmake/FetchData.cmake') }}-

      - name: Fetch the data
        run: cmake -P cmake/FetchData.cmake

      - name: Configure and build
        run: |
          cmake --preset linux-coverage
          cmake --build --preset linux-coverage --parallel 4

      - name: Run the tests and report the coverage of src/
        run: cmake -DBUILD_DIR=build/linux-coverage -DJOBS=4 -P tests/tools/coverage.cmake

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: build/linux-coverage/coverage

  macos:
    name: macos arm64 (${{ matrix.preset }})
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        preset: [macos-dev, macos-release, macos-asan]
    steps:
      - uses: actions/checkout@v4

      - name: LLVM ${{ env.LLVM_VERSION }}, Ninja, MPFR (Homebrew)
        shell: bash
        run: |
          set -euo pipefail
          brew install "llvm@$LLVM_VERSION" ninja mpfr gmp pkgconf
          echo "MYB_LLVM_ROOT=$(brew --prefix "llvm@$LLVM_VERSION")" >> "$GITHUB_ENV"
          echo "$(brew --prefix "llvm@$LLVM_VERSION")/bin" >> "$GITHUB_PATH"

      - name: Go (the test of bindings/go)
        if: ${{ matrix.preset != 'macos-asan' }}
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false

      - name: GHC and cabal (the test of bindings/haskell)
        if: ${{ matrix.preset != 'macos-asan' }}
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.10.3"
          cabal-version: "latest"

      - name: Python with cffi (a virtual environment) and Rust (the tests of bindings/)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --disable-pip-version-check cffi
          echo "MYB_PYTHON=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_ENV"
          cargo --version

      - name: Cache the downloaded data
        uses: actions/cache@v4
        with:
          path: data/download
          key: data-${{ hashFiles('cmake/FetchData.cmake') }}-${{ github.run_id }}
          restore-keys: data-${{ hashFiles('cmake/FetchData.cmake') }}-

      - name: Fetch the data (fresh live series)
        shell: bash
        run: cmake -DREFRESH=ON -P cmake/FetchData.cmake

      - name: Configure
        shell: bash
        run: |
          "$MYB_LLVM_ROOT/bin/clang" --version
          cmake --preset ${{ matrix.preset }} -DMYB_PYTHON="$MYB_PYTHON"

      - name: Bindings are registered
        if: ${{ matrix.preset != 'macos-asan' }}
        shell: bash
        run: |
          set -euo pipefail
          ctest --preset ${{ matrix.preset }} -N > registered.txt
          grep -q test_cpp_binding registered.txt
          grep -q test_rust_binding registered.txt
          grep -q test_go_binding registered.txt
          grep -q test_haskell_binding registered.txt
          if grep -q 'MYB_BUILD_SHARED:BOOL=ON' build/${{ matrix.preset }}/CMakeCache.txt; then
            grep -q test_python_binding registered.txt
          fi

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 3

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --parallel 3 --timeout ${{ env.CTEST_TIMEOUT }}

  windows:
    name: windows (${{ matrix.preset }})
    runs-on: windows-2025
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-dev, windows-release, windows-ubsan]
    steps:
      - uses: actions/checkout@v4

      - name: MSYS2 MINGW64 sysroot (headers, runtime, mingw32-make, MPFR, GMP)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-mpfr
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-pkgconf

      - name: Clang ${{ env.LLVM_VERSION }} (LLVM for Windows)
        shell: pwsh
        run: |
          $have = $null
          if (Get-Command clang -ErrorAction SilentlyContinue) {
            $have = [int]((clang --version | Select-Object -First 1) -replace '.*version (\d+).*', '$1')
          }
          if ($null -eq $have -or $have -lt 19) {
            choco install llvm --version=20.1.8 --allow-downgrade -y --no-progress
          }
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "MYB_MINGW_ROOT=${{ steps.msys2.outputs.msys2-location }}\mingw64" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Go (the test of bindings/go)
        if: ${{ matrix.preset != 'windows-ubsan' }}
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false

      - name: GHC and cabal (the test of bindings/haskell)
        if: ${{ matrix.preset == 'windows-release' }}
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.10.3"
          cabal-version: "latest"

      - name: Python with cffi and the Rust toolchain of the GNU ABI (the tests of bindings/)
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check cffi
          python -c "import cffi; print('cffi', cffi.__version__)"
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal --no-self-update
          cargo +stable-x86_64-pc-windows-gnu --version

      - name: Cache the downloaded data
        uses: actions/cache@v4
        with:
          path: data/download
          key: data-${{ hashFiles('cmake/FetchData.cmake') }}-${{ github.run_id }}
          restore-keys: data-${{ hashFiles('cmake/FetchData.cmake') }}-

      - name: Fetch the data (fresh live series)
        shell: pwsh
        run: cmake -DREFRESH=ON -P cmake/FetchData.cmake

      - name: Configure
        shell: pwsh
        run: |
          clang --version
          cmake --preset ${{ matrix.preset }}

      - name: Bindings are registered
        if: ${{ matrix.preset != 'windows-ubsan' }}
        shell: pwsh
        run: |
          $registered = ctest --preset ${{ matrix.preset }} -N | Out-String
          $wanted = @('test_cpp_binding', 'test_rust_binding', 'test_go_binding')
          if (Select-String -Path build/${{ matrix.preset }}/CMakeCache.txt -Pattern 'MYB_BUILD_SHARED:BOOL=ON' -Quiet) {
            # the shared library: Python, and the consumers built by Microsoft's toolchains
            $wanted += 'test_python_binding', 'test_msvc_consumer', 'test_rust_binding_msvc',
                       'test_haskell_binding'
          }
          foreach ($name in $wanted) {
            if ($registered -notmatch $name) { throw "$name is not registered" }
          }

      - name: Build
        shell: pwsh
        run: cmake --build --preset ${{ matrix.preset }} --parallel 4

      - name: Test
        shell: pwsh
        run: ctest --preset ${{ matrix.preset }} --parallel 4 --timeout ${{ env.CTEST_TIMEOUT }}
